name: Narrated incident deck
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: incident-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: incident-deck
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: incident-deck/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate && pnpm test && pnpm typecheck && pnpm build
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: incident-deck/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for any legacy branch publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import json, os, time
          from urllib.request import Request, urlopen
          repository = os.environ['GITHUB_REPOSITORY']
          def get(path):
              request = Request('https://api.github.com/repos/' + repository + path,
                                headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                                         'Accept': 'application/vnd.github+json'})
              with urlopen(request, timeout=30) as response:
                  return json.load(response)
          if get('/pages').get('build_type') == 'legacy':
              for attempt in range(36):
                  runs = get('/actions/runs?per_page=100&head_sha=' + os.environ['GITHUB_SHA'])['workflow_runs']
                  legacy = [r for r in runs if r['path'] == 'dynamic/pages/pages-build-deployment']
                  if legacy and all(r['status'] == 'completed' for r in legacy):
                      print('Legacy publisher finished. Deploying the deck after it.')
                      break
                  time.sleep(5)
              else:
                  raise SystemExit('Legacy publisher did not finish; choose GitHub Actions as the Pages source.')
          else:
              print('Pages already uses GitHub Actions.')
          PYTHON
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
