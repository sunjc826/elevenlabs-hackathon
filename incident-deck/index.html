<head>
  <meta name="description" content="A fictional production incident review with per-step narration, evidence and a three-minute recovery." />
  <script>
    // Audio playback needs no screen-wake permission. Avoid a Slidev default
    // permission request that fails in embedded and headless browsers.
    try { localStorage.setItem('slidev-wake-lock', 'false') } catch (_) {}
  </script>
</head>
